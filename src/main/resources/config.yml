# Сколько часов лот висит на аукционе
active-hours: 24
# Сколько часов истёкший лот ждёт владельца, потом удаляется навсегда
expired-hours: 24
# Максимум одновременно активных лотов у игрока
max-listings: 5
# Комиссия аукциона в процентах (продавец получает цену минус комиссия)
commission-percent: 5
# Ограничения цены
min-price: 1
max-price: 1000000000

